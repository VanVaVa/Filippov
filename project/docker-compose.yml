services:
  postgres:
    image: postgres:15-alpine
    container_name: hr-platform-postgres
    environment:
      POSTGRES_DB: hrplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hr-platform-network

  redis:
    image: redis:7-alpine
    container_name: hr-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hr-platform-network

  liquibase:
    build:
      context: .
      dockerfile: Dockerfile.liquibase
    container_name: hr-platform-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "--changeLogFile=db.changelog-master.xml"
      - "--searchPath=/liquibase/changelog"
      - "--url=jdbc:postgresql://postgres:5432/hrplatform"
      - "--username=postgres"
      - "--password=postgres"
      - "--driver=org.postgresql.Driver"
      - "--classpath=/liquibase/lib/postgresql.jar"
      - "update"
    volumes:
      - ./Data/Migrations/Liquibase/changelog:/liquibase/changelog
    networks:
      - hr-platform-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-platform-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hrplatform;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "8052:8080"
      - "9090:9090"
    networks:
      - hr-platform-network

  prometheus:
    image: prom/prometheus:latest
    container_name: hr-platform-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - hr-platform-network

  grafana:
    image: grafana/grafana:latest
    container_name: hr-platform-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - hr-platform-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  hr-platform-network:
    driver: bridge

